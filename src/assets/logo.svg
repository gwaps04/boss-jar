<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#f0f2f5"/>
      <stop offset="53%" stop-color="#9aa0a6"/>
      <stop offset="100%" stop-color="#bdc1c6"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2e4d"/>
      <stop offset="100%" stop-color="#b80c23"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Circular Target Background Emblem -->
  <g filter="url(#shadow)">
    <!-- Outer Red Ring -->
    <circle cx="250" cy="190" r="145" fill="none" stroke="#d90429" stroke-width="18"/>
    <!-- White Ring -->
    <circle cx="250" cy="190" r="136" fill="none" stroke="#ffffff" stroke-width="8"/>
    <!-- Inner Dark Core -->
    <circle cx="250" cy="190" r="128" fill="#111317"/>
    <!-- Red Inner Accent -->
    <circle cx="250" cy="190" r="125" fill="none" stroke="#ef233c" stroke-width="4" stroke-dasharray="12 6"/>
  </g>

  <!-- Motorcycle & Rider Silhouette / Illustration -->
  <g transform="translate(70, 60)">
    <!-- Motorbike Silhouette -->
    <path d="M 40,240 Q 60,200 110,195 Q 160,190 200,210 Q 240,200 280,230 Q 320,250 350,230 L 320,270 L 60,270 Z" fill="#1e222d"/>
    <path d="M 90,210 L 150,180 L 170,210 L 120,225 Z" fill="#2d3342" stroke="#d90429" stroke-width="2"/>
    <!-- Motorcycle Fairing & Red Accents -->
    <path d="M 230,170 L 290,185 L 260,220 Z" fill="#ef233c"/>
    <circle cx="100" cy="245" r="32" fill="#0f1115" stroke="#ef233c" stroke-width="4"/>
    <circle cx="270" cy="245" r="32" fill="#0f1115" stroke="#ef233c" stroke-width="4"/>
    
    <!-- Rider (Boss Jar) -->
    <!-- Head & Hair -->
    <circle cx="185" cy="85" r="24" fill="#d49b6a"/>
    <path d="M 165,85 Q 170,60 195,65 Q 215,70 210,95 Q 185,90 165,85 Z" fill="#181412"/>
    <!-- Torso / Shirt -->
    <path d="M 160,105 Q 185,100 210,105 L 225,160 Q 185,165 150,160 Z" fill="#122538"/>
    <!-- Graphic on Shirt -->
    <path d="M 175,120 L 185,135 L 195,120 Q 185,115 175,120 Z" fill="#ffd000"/>
    <!-- Arms & Hands -->
    <path d="M 155,110 L 125,150 L 140,160 L 165,125 Z" fill="#d49b6a"/>
    <path d="M 215,110 L 255,140 L 245,155 L 205,125 Z" fill="#d49b6a"/>
    <!-- Pants (White) -->
    <path d="M 150,160 Q 185,165 220,160 L 210,215 L 155,215 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- "BOSS" 3D Pop Typography -->
  <g transform="translate(130, 240) rotate(-6)">
    <!-- Drop Shadow / Red Border -->
    <text x="0" y="55" font-family="'Poppins', Impact, sans-serif" font-weight="900" font-size="62" fill="#000000" stroke="#000000" stroke-width="12" stroke-linejoin="round">BOSS</text>
    <text x="0" y="55" font-family="'Poppins', Impact, sans-serif" font-weight="900" font-size="62" fill="#d90429" stroke="#d90429" stroke-width="6" stroke-linejoin="round">BOSS</text>
    <!-- Front Bright Yellow -->
    <text x="0" y="55" font-family="'Poppins', Impact, sans-serif" font-weight="900" font-size="62" fill="url(#yellowGrad)">BOSS</text>
  </g>

  <!-- "JAR" Massive 3D Chrome Typography -->
  <g transform="translate(45, 360)">
    <!-- Dark Shadow -->
    <text x="0" y="80" font-family="'Poppins', Impact, sans-serif" font-weight="900" font-size="145" fill="#000000" stroke="#000000" stroke-width="24" stroke-linejoin="round">JAR</text>
    <!-- Bold Crimson Outer Border -->
    <text x="0" y="80" font-family="'Poppins', Impact, sans-serif" font-weight="900" font-size="145" fill="#d90429" stroke="#d90429" stroke-width="18" stroke-linejoin="round">JAR</text>
    <!-- Inner Dark Stroke -->
    <text x="0" y="80" font-family="'Poppins', Impact, sans-serif" font-weight="900" font-size="145" fill="#111317" stroke="#111317" stroke-width="6" stroke-linejoin="round">JAR</text>
    <!-- Chrome Silver Gradient Face -->
    <text x="0" y="80" font-family="'Poppins', Impact, sans-serif" font-weight="900" font-size="145" fill="url(#silverGrad)">JAR</text>
  </g>
</svg>
